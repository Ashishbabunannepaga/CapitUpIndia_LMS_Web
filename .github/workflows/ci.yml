name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cloudflare:
    name: Cloudflare Worker build and D1 migrations
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations match src/server/db/schema.ts
        run: |
          npx drizzle-kit generate --name ci-drift-check
          git status --porcelain migrations | tee /dev/stderr | (! grep .)
      - run: npm run d1:migrate:local
      - run: npm run cf:build
      - name: Bundle the Worker entry (app + cron)
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle

  e2e:
    name: End-to-end (browser and HTTP against the built Worker on local D1)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
