name: Firebase migration

on:
  pull_request:
    paths:
      - "migration/firebase/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/firebase-migration.yml"
  push:
    branches: [main]
    paths:
      - "migration/firebase/**"
      - "migrations/**"

jobs:
  import:
    name: Import mapping and D1 load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate:firebase:test
