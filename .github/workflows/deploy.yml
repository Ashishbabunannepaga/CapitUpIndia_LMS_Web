name: Deploy

# Production deploys only after every check passes. A push to main runs the
# full CI (lint, typecheck, unit tests, build, migration checks and the
# browser tests); the deploy job needs all of them, so a failing check
# means nothing reaches the live Worker or the live D1 database.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts: Edit and D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns capitup-lms-web
# and Cloudflare's own Workers Builds deploy switched off, otherwise
# Cloudflare still deploys every push without waiting. See docs/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate D1 and deploy the Worker
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets are set
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so this run did not deploy. See docs/deploy.md, 'Gated deploys'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Migration guard (again, on exactly what is deployed)
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/check-migrations.mjs
      - name: Build the Worker
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:build
      - name: Apply new D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
